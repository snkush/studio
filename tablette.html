<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>SNK Studio · Tablette</title>
<style>
:root{--bg:#0d0c0b;--card:#181614;--ink:#f2efe9;--mut:#9a948a;--acc:#f0a35b;--line:#2a2724}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:500 14px/1.3 "Space Grotesk",system-ui,sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:800 15px/1 "Space Grotesk",system-ui;letter-spacing:.08em;text-transform:uppercase}
#st{font:500 12px/1 ui-monospace,Menlo,monospace;color:var(--mut);display:flex;align-items:center;gap:6px}
#st i{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block}
#st.on i{background:#4ade80;box-shadow:0 0 8px #4ade80}
#wrap{display:grid;place-items:center;min-height:0}
canvas{max-width:100%;max-height:100%;aspect-ratio:880/600;width:100%;border-radius:14px;background:
 linear-gradient(0deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/40px 40px,
 linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/40px 40px,#3a3836;
 box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.5);cursor:crosshair}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center}
.sw{display:flex;gap:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 0 0 1px #3a3633}
.sw button[aria-pressed=true]{border-color:var(--ink);transform:scale(1.12)}
.sz{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}
input[type=range]{accent-color:var(--acc);width:110px}
.b{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px/1 inherit;font-family:inherit;cursor:pointer}
.b[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.go{background:var(--acc);color:#1a1208;border:0;font-weight:800;padding:0 20px}
.go:disabled,.b:disabled{opacity:.4;cursor:default}
#msg{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
#msg.v{opacity:1}
</style>
<header><h1>Tablette · mur à tags</h1><span id="st"><i></i><span>connexion…</span></span></header>
<div id="wrap"><canvas id="cv" width="880" height="600" aria-label="Zone de dessin"></canvas></div>
<footer>
 <div class="sw" id="sw"></div>
 <label class="sz">Trait <input id="w" type="range" min="3" max="60" value="12"></label>
 <button class="b" id="er" aria-pressed="false">Gomme</button>
 <button class="b" id="clr">Effacer</button>
 <button class="b go" id="go" disabled>Poser sur le mur</button>
</footer>
<div id="msg" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
(function(){"use strict";
// Même salle et même clé publique que le studio (index.html). ?to=<id du joueur> (lien « Tablette » du mur), ?labo=NOM pour la salle de test.
const SB_URL='https://csenvzufrnvrmnvghece.supabase.co',SB_KEY='sb_publishable_E10hR2IFmralJmEFjFa7fQ_M-abUMBW';
const q=new URLSearchParams(location.search),TO=(q.get('to')||'').slice(0,32),LABO=((q.get('labo')||'').match(/^[A-Za-z0-9-]{2,16}$/)||[''])[0].toUpperCase();
const ROOM=LABO?'LABO-'+LABO:'STUDIO',ID='tab-'+Math.random().toString(36).slice(2,8);
const $=s=>document.querySelector(s),cv=$('#cv'),g=cv.getContext('2d'),st=$('#st'),msg=$('#msg');
const COLS=['#f2efe9','#111111','#d81f2a','#f0a35b','#facc15','#4ade80','#38bdf8','#a855f7'];
let col=COLS[2],er=false,ch=null,on=false,drawn=false,buf=[],last=null,first=true,tm=0;
function say(t){msg.textContent=t;msg.classList.add('v');clearTimeout(tm);tm=setTimeout(()=>msg.classList.remove('v'),2600);}
COLS.forEach(c=>{const b=document.createElement('button');b.style.setProperty('--c',c);b.setAttribute('aria-label','Couleur '+c);b.setAttribute('aria-pressed',c===col);
  b.onclick=()=>{col=c;er=false;$('#er').setAttribute('aria-pressed',false);[...$('#sw').children].forEach(x=>x.setAttribute('aria-pressed',x===b));};$('#sw').appendChild(b);});
$('#er').onclick=e=>{er=!er;e.currentTarget.setAttribute('aria-pressed',er);};
function send(o){if(!ch||!on)return false;ch.send({type:'broadcast',event:'cr',payload:Object.assign({i:ID,n:'Tablette',t:'tk',to:TO},o)});return true;}
function flush(){if(buf.length<2){return;}const s=buf.map(p=>[+p[0].toFixed(4),+p[1].toFixed(4)]);send({s,c:col,w:+$('#w').value,e:er?1:0,nw:first?1:0});first=false;buf=[buf[buf.length-1]];}
setInterval(flush,90);
function pt(e){const r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];}
function seg(a,b){g.lineCap=g.lineJoin='round';g.lineWidth=+$('#w').value;g.globalCompositeOperation=er?'destination-out':'source-over';g.strokeStyle=col;g.beginPath();g.moveTo(a[0]*880,a[1]*600);g.lineTo(b[0]*880,b[1]*600);g.stroke();g.globalCompositeOperation='source-over';}
cv.addEventListener('pointerdown',e=>{if(!TO){say('Ouvre ce lien depuis le bouton « Tablette » du mur.');return;}cv.setPointerCapture(e.pointerId);last=pt(e);buf=[last,last];seg(last,last);drawn=true;$('#go').disabled=false;});
cv.addEventListener('pointermove',e=>{if(!last)return;const p=pt(e);seg(last,p);last=p;buf.push(p);if(buf.length>=300)flush();});
const up=()=>{if(!last)return;flush();last=null;buf=[];};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
$('#clr').onclick=()=>{g.clearRect(0,0,880,600);drawn=false;$('#go').disabled=true;send({clr:1});};
$('#go').onclick=()=>{if(!drawn)return;flush();if(send({go:1})){say('Ton avatar tague le dessin sur le mur');g.clearRect(0,0,880,600);drawn=false;first=true;$('#go').disabled=true;}else say('Pas connecté au studio');};
function setSt(ok,t){on=ok;st.classList.toggle('on',ok);st.lastElementChild.textContent=t;}
if(!TO)setSt(false,'lien incomplet');
else if(!window.supabase)setSt(false,'hors ligne');
else{const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
  ch=sb.channel('studio:'+ROOM,{config:{broadcast:{self:false}}});
  ch.subscribe(s=>{if(s==='SUBSCRIBED')setSt(true,LABO?'labo '+LABO:'studio');else if(s==='CLOSED'||s==='CHANNEL_ERROR'||s==='TIMED_OUT')setSt(false,'déconnecté');});}
})();
</script>
</html>
